name: Weekly R2 to Google Drive Backup

on:
  schedule:
    # Runs at 02:00 UTC every Sunday
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    name: "Sync R2 to Google Drive"
    runs-on: ubuntu-latest
    steps:
      - name: Install Rclone
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Restore Rclone Configuration
        env:
          RCLONE_CONFIG_DATA: ""
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Test Remote Connectivity
        run: |
          rclone listremotes

      - name: Execute Backup Copy
        run: |
          rclone copy r2:tenant-commerce-images gdrive:R2-Weekly-Backups \
            --fast-list \
            --transfers 4 \
            --checkers 8 \
            --drive-chunk-size 32M \
            -v