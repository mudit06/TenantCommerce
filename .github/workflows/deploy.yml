name: Build and Publish Docker Image

on:
  push:
    branches:
      - "claude/adoring-cori-we1zlg"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Stage 1: Setup & Dependency Validation
  prepare-and-test:
    name: "Stage 1: Prepare & Verify"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # Stage 2: Explicit Sentry Release Registration
  sentry-release:
    name: "Stage 2: Create Sentry Release"
    needs: prepare-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "o4512271472590848"
          SENTRY_PROJECT: "javascript-nextjs"
        with:
          version: ${{ github.sha }}
          environment: production

  # Stage 3: Docker Build and Image Publishing
  docker-build-push:
    name: "Stage 3: Build & Publish Image"
    needs: sentry-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tenantcommerce:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tenantcommerce:latest