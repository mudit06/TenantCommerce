name: Build and Publish Docker Image

on:
  push:
    branches:
      - "claude/adoring-cori-we1zlg"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install pnpm first so setup-node can find it
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      # 2. Setup Node with pnpm caching enabled check
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tenantcommerce:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tenantcommerce:latest