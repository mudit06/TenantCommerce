<meta charset="utf-8">
<title>TenantEcom Wireframes</title>
<meta name="description" content="Clickable low-fidelity wireframes for the TenantEcom super admin, vendor CMS and storefront PWA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a drafting table. Screen index | grayscale paper sheet on a cool canvas | redline notes.
   The drawing itself stays grayscale; only the annotation layer (redlines, Phase 2, flags) carries colour. */
:root{
  --canvas:#E3E7EB;
  --surface:#F2F4F6;
  --paper:#FFFFFF;
  --ink:#1C222A;
  --ink-2:#55606C;
  --ink-3:#86909B;
  --wire:#B3BCC6;
  --fill:#EDF0F3;
  --fill-2:#DADFE5;
  --red:#C4321A;
  --red-soft:#FADFD7;
  --p2:#8F5600;
  --p2-soft:#FDEFD3;
  --flag:#0C6B65;
  --flag-soft:#D7F0EC;
  --shadow:rgba(24,34,46,.10);
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#111418;--surface:#171B20;--paper:#1E2329;--ink:#E2E6EA;--ink-2:#A5AEB8;--ink-3:#748090;
  --wire:#46505B;--fill:#262C33;--fill-2:#333B44;--red:#FF6B47;--red-soft:#3B1D16;--p2:#F0B04A;--p2-soft:#3A2B10;
  --flag:#4CCDC1;--flag-soft:#123230;--shadow:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#111418;--surface:#171B20;--paper:#1E2329;--ink:#E2E6EA;--ink-2:#A5AEB8;--ink-3:#748090;
  --wire:#46505B;--fill:#262C33;--fill-2:#333B44;--red:#FF6B47;--red-soft:#3B1D16;--p2:#F0B04A;--p2-soft:#3A2B10;
  --flag:#4CCDC1;--flag-soft:#123230;--shadow:rgba(0,0,0,.45);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
table{font:inherit;color:inherit;border-collapse:collapse}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--font-mono);font-size:.92em}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- App shell ---------- */
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--wire)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand small{font:500 10.5px var(--font-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.seg{display:inline-flex;border:1px solid var(--wire);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--wire)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wire);background:var(--paper);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.tbtn[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.sample{font:500 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px dashed var(--wire);border-radius:6px;padding:4px 8px}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
.index{min-height:0;overflow:auto;border-right:1px solid var(--wire);background:var(--surface);padding:14px 10px 24px}
.index .about{font-size:12.5px;color:var(--ink-2);padding:0 8px 12px;border-bottom:1px solid var(--wire);margin-bottom:6px}
.index h3{font:600 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:14px 8px 4px}
.index ul{list-style:none;margin:0;padding:0}
.index a{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:13px}
.index a:hover{background:var(--fill)}
.index a[aria-current="page"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--wire)}
.index select{display:none;width:100%;padding:8px;border-radius:8px;border:1px solid var(--wire);background:var(--paper);color:var(--ink);font:inherit}

.work{min-height:0;overflow:auto;display:flex;flex-direction:column}
.stage{padding:18px 22px 40px;min-width:0}
.stage-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.stage-head h1{font-size:21px;line-height:1.2;margin:2px 0 0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font:500 10.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pager{display:flex;gap:6px;align-items:center}
.zoom{font:500 11px var(--font-mono);color:var(--ink-3);min-width:40px;text-align:right}
.viewport{overflow-x:auto;overflow-y:visible}
.sheet-wrap{display:flex;justify-content:center;min-width:min-content}

.notes{padding:22px 22px 48px;border-top:1px solid var(--wire);background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px 44px;align-items:start;scroll-margin-top:8px}
.n-main,.n-red{min-width:0}
.n-red .rl-h{margin-top:4px}
.notes h2{font-size:18px;margin:4px 0 6px;letter-spacing:-.01em}
.notes .purpose{margin:0 0 12px;color:var(--ink-2);font-size:13.5px}
.meta{margin:0 0 14px;display:grid;gap:8px;font-size:12.5px}
.meta div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.meta dt{font:500 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding-top:2px}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.meta code{background:var(--fill);border-radius:4px;padding:0 4px;margin:0 2px 2px 0;display:inline-block}
.rl{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:13px}
.rl li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.rl code{background:var(--fill);border-radius:4px;padding:0 3px}
.rl-h{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.rl-h::after{content:"";flex:1;border-top:1px solid var(--red);opacity:.5}
.rl-h span{font:600 10.5px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
.legend{margin-top:20px;padding-top:12px;border-top:1px solid var(--wire);display:grid;gap:7px;font-size:12px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:8px}
.lg-box{width:26px;height:16px;border:1.5px solid var(--ink-2);border-radius:3px;flex:none}
.lg-box.p2{border:1.5px dashed var(--p2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}

@media (max-width:980px){
  .notes{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{height:auto}
  .layout{display:block}
  .index{border-right:0;border-bottom:1px solid var(--wire);padding:10px 16px}
  .index .about,.index nav{display:none}
  .index select{display:block}
  .work{overflow:visible}
  .stage{padding:14px 16px 28px}
  .notes{padding:16px}
  .tools{margin-left:0}
}

/* ---------- Annotation layer ---------- */
.pin{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:var(--red);color:#fff;font:600 10.5px/1 var(--font-mono);font-style:normal;vertical-align:middle;margin:0 3px;box-shadow:0 0 0 2px var(--paper);flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1.2 var(--font-mono);font-style:normal;letter-spacing:.03em;border-radius:4px;padding:2px 5px;white-space:nowrap;vertical-align:middle}
.t-p2{background:var(--p2-soft);color:var(--p2)}
.t-flag{background:var(--flag-soft);color:var(--flag)}
.t-later{background:var(--fill-2);color:var(--ink-2)}
.zn{position:relative}
.zn>.tags{position:absolute;top:-9px;right:8px;display:flex;gap:4px;z-index:2}
.zn.p2{outline:1.5px dashed var(--p2);outline-offset:4px;border-radius:4px}
.fold{position:absolute;left:0;right:0;border-top:1.5px dashed var(--red);pointer-events:none;z-index:9}
.fold span{position:absolute;right:6px;top:-18px;font:600 9.5px var(--font-mono);color:var(--red);background:var(--paper);padding:1px 5px;border-radius:3px;letter-spacing:.04em}

/* ---------- Wireframe sheet ---------- */
.sheet{position:relative;background:var(--paper);border:1px solid var(--wire);border-radius:10px;box-shadow:0 1px 2px var(--shadow),0 10px 34px var(--shadow);overflow:clip;flex:none}
.sheet.dev-m{border:9px solid var(--fill-2);border-radius:30px}
.sheet.fixed{overflow:clip}
.wf{font-size:13px;line-height:1.4;color:var(--ink)}
.wf h1,.wf h2,.wf h3,.wf h4,.wf h5,.wf p{margin:0}
.wf [data-go]{cursor:pointer}
.wf [data-go]:hover{outline:2px solid var(--red);outline-offset:1px}
.wf.show-hot [data-go]{outline:2px solid var(--red);outline-offset:1px;background-image:linear-gradient(var(--red-soft),var(--red-soft))}
.wf.show-hot button[data-go].pri{background-image:none}
.dev-m .d-only,.dev-d .m-only{display:none!important}

.ic{flex:none;vertical-align:middle}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.nw{flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.sp{flex:1}
.g{display:grid;gap:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.c12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.c31{grid-template-columns:minmax(0,3fr) minmax(0,1.15fr)}
.dev-m .m1{grid-template-columns:minmax(0,1fr)}.dev-m .m2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dev-m .m3{grid-template-columns:repeat(3,minmax(0,1fr))}
.small{font-size:12px}.xs{font-size:11px}.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.b6{font-weight:600}.r{text-align:right}.nowrap{white-space:nowrap}
.hr{border-top:1px solid var(--fill-2)}
.sec-t{font:600 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}

/* placeholders */
.ph{position:relative;display:flex;align-items:center;justify-content:center;border:1px solid var(--wire);border-radius:4px;min-height:24px;
  background:linear-gradient(to top right,transparent calc(50% - .6px),var(--wire) 50%,transparent calc(50% + .6px)),
             linear-gradient(to top left,transparent calc(50% - .6px),var(--wire) 50%,transparent calc(50% + .6px)),var(--fill);max-width:100%}
.ph>span{font:500 10.5px var(--font-mono);color:var(--ink-2);background:var(--paper);padding:2px 6px;border-radius:3px;text-align:center;max-width:90%}
.ph.round{border-radius:50%}
.lns{display:flex;flex-direction:column;gap:6px}
.lns i{display:block;height:7px;border-radius:4px;background:var(--fill-2)}

/* controls */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink-2);background:var(--paper);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:default;white-space:nowrap;min-height:32px}
.b.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.b.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.b.danger{border-style:dashed}
.b.sm{padding:3px 8px;min-height:26px;font-size:12px}
.b.lg{min-height:44px;font-size:14px;padding:10px 18px}
.b.block{width:100%}
.b.ico{padding:6px;min-width:32px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl{font-size:11.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:2px}
.req{color:var(--ink);font-weight:700}
.in{display:flex;align-items:center;gap:6px;min-height:32px;border:1px solid var(--wire);border-radius:6px;padding:6px 10px;background:var(--paper);font-size:12.5px;min-width:0;overflow:hidden}
.in.empty{color:var(--ink-3)}
.in.ta{min-height:64px;align-items:flex-start}
.in.sel{justify-content:space-between}
.in em{font-style:normal;color:var(--ink-3);margin-left:auto;font-size:12px}
.in.lg{min-height:44px;font-size:14px}
.in.focus{border-color:var(--ink);box-shadow:0 0 0 2px var(--fill-2)}
.help{font-size:11px;color:var(--ink-3)}
.tgl{display:inline-flex;align-items:center;gap:8px;font-size:12.5px}
.tg{position:relative;display:inline-block;width:30px;height:18px;border-radius:9px;background:var(--fill-2);border:1px solid var(--wire);flex:none}
.tg i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:1px solid var(--ink-3)}
.tg.on{background:var(--ink);border-color:var(--ink)}
.tg.on i{left:14px;border-color:var(--ink)}
.tg.lock{background:none;border-style:dashed}
.tg.lock i{display:none}
.ck,.rd{display:inline-flex;align-items:center;gap:7px;font-size:12.5px}
.ck>i,.rd>i{width:15px;height:15px;border:1.5px solid var(--ink-2);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--paper)}
.ck.on>i{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rd>i{border-radius:50%}
.rd.on>i{box-shadow:inset 0 0 0 3px var(--paper);background:var(--ink)}
.pl{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--wire);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:500;white-space:nowrap;color:var(--ink-2);background:var(--paper)}
.pl.s-ok::before,.pl.s-warn::before,.pl.s-off::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
.pl.s-ok{color:var(--ink);border-color:var(--ink-2)}
.pl.s-ok::before{background:var(--ink)}
.pl.s-warn::before{border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.pl.s-off::before{border:1.5px solid var(--ink-3)}
.pl.s-bad{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pl.dash{border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wire);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--paper);white-space:nowrap}
.chip.on{border-color:var(--ink);background:var(--fill)}
.kbd{font:500 10.5px var(--font-mono);border:1px solid var(--wire);border-radius:4px;padding:0 4px;color:var(--ink-3)}
.av{width:28px;height:28px;border-radius:50%;background:var(--fill-2);display:inline-flex;align-items:center;justify-content:center;font:600 10.5px var(--font-mono);color:var(--ink-2);flex:none}
.swt{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--ink-2);vertical-align:middle;flex:none}
.sw-chrome{background:var(--fill-2)}
.sw-black{background:var(--ink)}
.sw-gold{background:repeating-linear-gradient(45deg,var(--ink-2) 0 1.5px,var(--paper) 1.5px 4px)}
.sw-white{background:var(--paper)}
.sw-gun{background:var(--ink-3)}

/* blocks */
.card{border:1px solid var(--wire);border-radius:8px;background:var(--paper);min-width:0}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--fill-2)}
.card>.ch h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.card>.cb{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card.flat>.cb{padding:0}
.kpi{border:1px solid var(--wire);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--paper)}
.kpi .kl{font:500 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);display:flex;align-items:center}
.kpi b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .ks{font-size:11.5px;color:var(--ink-2)}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .mt{display:flex;justify-content:space-between;font-size:12px}
.meter .mb{height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden}
.meter .mb i{display:block;height:100%;background:var(--ink-2)}
.meter.hot .mb i{background:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--wire);padding-top:4px}
.bars i{flex:1;background:var(--fill-2);border-radius:2px 2px 0 0;min-width:2px}
.bars i.hl{background:var(--ink-2)}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;font:500 10px var(--font-mono);color:var(--ink-3)}
.chart .ya{display:flex;flex-direction:column;justify-content:space-between;text-align:right;height:124px}
.chart .xa{grid-column:2;display:flex;justify-content:space-between}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--wire);overflow:hidden;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 12px;font-size:12.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:default}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .n{font:500 10.5px var(--font-mono);color:var(--ink-3);margin-left:4px}
.tblw{overflow-x:auto;min-width:0}
.tbl{width:100%;font-size:12.5px}
.tbl th{font:500 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:7px 10px;border-bottom:1px solid var(--wire);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--fill-2);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .c0{width:28px;padding-right:0}
.tbl td .sub{display:block;font-size:11px;color:var(--ink-3)}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.step{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3)}
.step i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;font:600 10.5px var(--font-mono);font-style:normal}
.step.done{color:var(--ink-2)}
.step.done i{background:var(--ink-2);border-color:var(--ink-2);color:var(--paper)}
.step.now{color:var(--ink);font-weight:600}
.step.now i{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.step-sep{width:22px;border-top:1px solid var(--wire)}
.list{display:flex;flex-direction:column}
.list>*{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--fill-2);min-width:0}
.list>*:last-child{border-bottom:0}
.drawer{border-left:1px solid var(--wire);background:var(--paper)}
.callout{border:1px solid var(--wire);border-radius:8px;background:var(--fill);padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.callout.alert{background:var(--paper);border:1.5px solid var(--ink)}
.empty-state{border:1px dashed var(--wire);border-radius:8px;padding:18px;text-align:center;color:var(--ink-2);font-size:12.5px}
.otp{display:flex;gap:8px}
.otp span{width:40px;height:46px;border:1px solid var(--wire);border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 18px var(--font-mono)}
.otp span.f{border-color:var(--ink)}

/* admin chrome */
