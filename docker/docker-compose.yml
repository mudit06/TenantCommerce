# Local MongoDB as a single-node replica set (Payload needs one for transactions, docs/02).
#   docker compose -f docker/docker-compose.yml up -d mongo
# The app service builds the production image; start it with `--profile app` when you
# want to check the Docker build (docs/15: keep the image working).
name: tenantecom

services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it has a primary
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  app:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URI: mongodb://mongo:27017/tenantecom?replicaSet=rs0&directConnection=true
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
